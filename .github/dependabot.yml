version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    automerged_updates:
      - match:
          update-types: ["version-update:semver-minor", "version-update:semver-patch"]
        merge-method: "squash"

  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    automerged_updates:
      - match:
          update-types: ["version-update:semver-minor", "version-update:semver-patch"]
        merge-method: "squash"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    automerged_updates:
      - match:
          update-types: ["version-update:semver-minor", "version-update:semver-patch"]
        merge-method: "squash"
